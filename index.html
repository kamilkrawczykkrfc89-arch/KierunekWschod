    <style>
        :root {
            --primary-gold: #D4AF37;
            --text-light: #F5F5F5;
            --overlay-dark: rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            height: 100%;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            background-color: #111;
        }

        body {
            opacity: 0;
            /* Star invisible */
            transition: opacity 0.8s ease-in-out;
        }

        body.loaded {
            opacity: 1;
        }

        /* Loading Screen */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease-out;
            pointer-events: none;
        }

        .loader.hidden {
            opacity: 0;
        }

        /* Slideshow */
        .slideshow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transform: scale(1.1);
            transition: opacity 1.5s ease-in-out;
        }

        .slide.active {
            opacity: 1;
            z-index: 2;
            animation: kenBurns 20s infinite alternate ease-in-out;
        }

        /* Keep animation running while fading out */
        .slide.previous {
            opacity: 0;
            z-index: 1;
            animation: kenBurns 20s infinite alternate ease-in-out;
        }

        @keyframes kenBurns {
            0% {
                transform: scale(1.1) translate(0, 0);
            }

            50% {
                transform: scale(1.15) translate(-1%, -1%);
            }

            100% {
                transform: scale(1.2) translate(1%, 1%);
            }
        }



        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0.6) 100%);
            z-index: 2;
        }

        /* Language Selector */
        .content-wrapper {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            /* Align to top to be closer to Header Logo */
            padding-top: 180px;
            /* Space for Header + Gap */
            align-items: center;
            color: var(--text-light);
            text-align: center;
        }

        .brand-title {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 1s 0.5s forwards ease-out;
        }

        .brand-subtitle {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 1.5rem;
            color: var(--primary-gold);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 1s 0.8s forwards ease-out;
        }

        .lang-selector {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2rem 3rem;
            /* Row gap 2rem, Col gap 3rem */
            max-width: 900px;
            margin: 0 auto;
            opacity: 0;
            animation: fadeIn 1s 1.5s forwards;
        }

        .lang-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.27);
        }

        .lang-option:hover {
            transform: scale(1.15);
        }

        .flag-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            margin-bottom: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            overflow: hidden;
            position: relative;
        }

        .lang-option:hover .flag-icon {
            border-color: var(--primary-gold);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        .lang-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .lang-option:hover .lang-label {
            opacity: 1;
            color: var(--primary-gold);
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        /* SVG Flags */
        svg {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .lang-selector {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 2rem 1rem;
                width: 100%;
                padding: 0 1rem;
                justify-items: center;
            }

            .flag-icon {
                width: 50px;
                height: 50px;
                margin-bottom: 0.5rem;
            }

            .lang-label {
                font-size: 0.7rem;
                letter-spacing: 1px;
            }

            .brand-logo {
                max-width: 200px !important;
            }

            .brand-subtitle {
                margin-bottom: 2rem;
                margin-bottom: 2rem;
                font-size: 0.8rem;
            }
        }

        /* Splash Page Specific Overrides */
        .splash-header .nav-links,

            display: none !important;
        }

        /* Ensure Logo alignment matches */
        .splash-header .nav-container {

        @media (max-width: 768px) {
            /* Mobile Splash Optimization */

            /* Center the header logo explicitly */

                justify-content: center !important;
                padding-bottom: 0;
            }

            /* Make Logo Bigger on Mobile Splash (but smaller than 140px) */

            /* Bring Content Closer */

                /* Add some space if needed, or keep 0? User said "closer". Keeping 0 from inline style, or small gap. */
                /* Actually inline style says margin-top: 0 */

        }
    </style>

    <script>
        // Loader
        // Loader & Fade In (More robust trigger)
        function initPage() {
            const loader = document.getElementById('loader');
            if (loader) loader.classList.add('hidden');
            document.body.classList.add('loaded');
        }

        // Trigger as soon as DOM is ready, don't wait for images
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(initPage, 100); // Small buffer
        });

        // Fallback in case DOMContentLoaded already fired
        if (document.readyState === 'interactive' || document.readyState === 'complete') {
            initPage();
        }

        // Slideshow Logic
        const slides = document.querySelectorAll('.slide');
        let currentSlide = 0;

        setInterval(() => {
            // Mark current as previous to fade it out smoothly while keeping animation
            const prevSlide = slides[currentSlide];
            prevSlide.classList.remove('active');
            prevSlide.classList.add('previous');

            // Clean up 'previous' class after transition is done (1.5s)
            setTimeout(() => {
                prevSlide.classList.remove('previous');
            }, 1500);

            // Activate next
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }, 5000);

        // Language Selection
        function selectLanguage(lang) {
            // Fade out effect
            document.body.classList.remove('loaded');

            setTimeout(() => {
                window.location.href = `app.html?lang=${lang}`;
            }, 800);
        }
    </script>
